plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.KillerYT'
version = '0.0.2-beta-8'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    // Paper API (используется Paper 1.21.4, API версия 1.21.4-R0.1-SNAPSHOT)
    compileOnly "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"

    // Adventure – входит в Paper API, но для явной зависимости можно добавить
    // compileOnly "net.kyori:adventure-api:4.17.0"

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // PlaceholderAPI (опционально, для совместимости)
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // BungeeCord Chat API (используется для ActionBar)
    compileOnly 'net.md-5:bungeecord-chat:1.20-R0.2'
}

// Настройка shadowJar (если нужно собрать fat jar)
shadowJar {
    archiveBaseName.set('RegionMC')
    archiveVersion.set(project.version)
    archiveClassifier.set('')
    // Если вы хотите включить зависимости внутрь JAR, раскомментируйте:
    // minimize()
    // Но лучше оставить зависимости как compileOnly, чтобы сервер подгружал их сам.
}

// Задача сборки
build {
    dependsOn shadowJar
}

// Если вы не хотите shadowJar, можете использовать стандартный jar:
// jar {
//     manifest {
//         attributes 'Main-Class': 'org.KillerYT.regionMC.RegionMC'
//     }
// }

// Копирование собранного JAR в папку плагинов (опционально)
// Можно добавить задачу для автоматической установки на сервер:
// task deploy(type: Copy) {
//     from shadowJar
//     into 'C:/path/to/server/plugins'
// }