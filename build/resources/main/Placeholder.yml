# Плейсхолдеры RegionMC
# Идентификатор: regionmc
# Формат: %regionmc_<placeholder>%

Основные плейсхолдеры:
  %regionmc_version% - версия плагина
  %regionmc_test% - проверка работы плейсхолдеров (возвращает версию)

Статистика:
  %regionmc_total_regions% - всего регионов на сервере
  %regionmc_region_count% - алиас для total_regions
  %regionmc_region_limit% - лимит регионов у игрока
  %regionmc_player_max_regions% - алиас для region_limit
  %regionmc_player_regions_count% - количество регионов у игрока
  %regionmc_player_region_count% - алиас для player_regions_count
  %regionmc_player_total_regions% - алиас для player_regions_count
  %regionmc_player_regions_remaining% - сколько регионов еще можно создать
  %regionmc_has_region% - есть ли у игрока регионы (Да/Нет)

Текущее положение игрока:
  %regionmc_current_name% - название текущего региона (игнорирует __Global__)
  %regionmc_current_region_name% - алиас для current_name
  %regionmc_in_region% - находится ли игрок в регионе (Да/Нет, игнорирует __Global__)
  %regionmc_current_world% - мир, в котором находится игрок

Разрешения игрока (текущий регион):
  %regionmc_can_build% - может ли игрок строить в текущем регионе (Да/Нет)
  %regionmc_player_can_build% - алиас для can_build
  %regionmc_can_break% - может ли игрок ломать в текущем регионе (Да/Нет)
  %regionmc_can_interact% - может ли игрок взаимодействовать в текущем регионе (Да/Нет)

Информация о текущем регионе:
  %regionmc_current_owner% - владельцы текущего региона (игнорирует __Global__)
  %regionmc_region_owner% - алиас для current_owner
  %regionmc_current_members% - участники текущего региона (игнорирует __Global__)
  %regionmc_region_member% - алиас для current_members
  %regionmc_current_priority% - приоритет текущего региона (игнорирует __Global__)
  %regionmc_current_size% - размер текущего региона в блоках (игнорирует __Global__)

Права игрока в текущем регионе:
  %regionmc_player_is_owner% - является ли игрок владельцем текущего региона (Да/Нет)
  %regionmc_player_is_member% - является ли игрок участником текущего региона (Да/Нет)

Плейсхолдеры с указанием региона (замените {regionname} на имя региона):
  %regionmc_current_owner_{regionname}% - владельцы указанного региона
  %regionmc_current_members_{regionname}% - участники указанного региона
  %regionmc_current_priority_{regionname}% - приоритет указанного региона
  %regionmc_current_size_{regionname}% - размер указанного региона в блоках
  %regionmc_in_region_{regionname}% - находится ли игрок в указанном регионе (Да/Нет)
  %regionmc_player_is_owner_{regionname}% - является ли игрок владельцем указанного региона (Да/Нет)
  %regionmc_player_is_member_{regionname}% - является ли игрок участником указанного региона (Да/Нет)
  %regionmc_can_build_{regionname}% - может ли игрок строить в указанном регионе (Да/Нет)
  %regionmc_can_break_{regionname}% - может ли игрок ломать в указанном регионе (Да/Нет)
  %regionmc_can_interact_{regionname}% - может ли игрок взаимодействовать в указанном регионе (Да/Нет)

Старые форматы (для обратной совместимости):
    %regionmc_region_owner_{regionname}% - владельцы указанного региона (старый формат)
      %regionmc_region_member_{regionname}% - участники указанного региона (старый формат)
      %regionmc_info_{regionname}% - информация о регионе: имя, приоритет, владельцы

Примеры использования:
  # Проверка владения
  %regionmc_current_owner% - владельцы региона, где стоит игрок
  %regionmc_current_owner_MyRegion% - владельцы региона "MyRegion"
  
  # Проверка разрешений
  %regionmc_can_build% - может ли строить там, где стоит
  %regionmc_can_build_Home% - может ли строить в регионе "Home"
  
  # Проверка положения
  %regionmc_in_region% - в любом ли регионе стоит
  %regionmc_in_region_Home% - стоит ли в регионе "Home"
  
  # Информация о регионе
  %regionmc_current_name% - название региона, где стоит
  %regionmc_info_Home% - полная информация о регионе "Home"

Важные примечания:
  1. Все плейсхолдеры игнорируют глобальный регион __Global__
2. Регистр имени региона ВАЖЕН:
  - %regionmc_current_owner_MyHome% - проверяет регион "MyHome"
  - %regionmc_current_owner_myhome% - проверяет регион "myhome" (если он существует)
  - 3. Регионы "MyHome" и "myhome" считаются РАЗНЫМИ регионами
  - 4. Если игрок не в регионе или регион не найден, плейсхолдер вернет пустую строку или "Нет"
5. Для разрешений: если регион не существует или это __Global__, возвращается "Да"
  6. Плейсхолдеры работают только при наличии установленного PlaceholderAPI

Рекомендация:
Используйте единый стиль именования регионов (например, только с большой буквы: "Home", "MyRegion")
и указывайте имена точно так же в плейсхолдерах: %regionmc_current_owner_Home%