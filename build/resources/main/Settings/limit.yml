# limit.yml - конфигурация лимитов регионов
# =============================================

# =============================================
# ГЛОБАЛЬНОЕ ВКЛЮЧЕНИЕ/ВЫКЛЮЧЕНИЕ
# =============================================
# true  - все лимиты ВКЛЮЧЕНЫ
# false - все лимиты ОТКЛЮЧЕНЫ (полная безлимитность)
Enable: true


# =============================================
# НАСТРОЙКИ РАЗМЕРОВ РЕГИОНОВ (БАЗОВЫЕ)
# =============================================
size-limits:
  # Включить/выключить проверку размеров
  enable-size-checks: true

  # Минимальный размер региона (объем в блоках)
  # -1 или 0 = без ограничения минимума
  min-size: 5

  # Максимальный размер региона (объем в блоках)
  # -1 = без ограничения максимума
  max-size: 100000

  # Максимальная высота региона (координата Y)
  # -1 или 0 = безлимитная высота
  # 256 = ограничение высоты 256 блоками
  max-height: 256


# =============================================
# НАСТРОЙКИ КОЛИЧЕСТВА РЕГИОНОВ (БАЗОВЫЕ)
# =============================================
# Лимит по умолчанию для всех игроков
default-max-regions: 5


# =============================================
# ПРИОРИТЕТ ПРОВЕРКИ
# =============================================
# permission-first - сначала ПЕРМИШЕНЫ, потом ГРУППЫ
# group-first       - сначала ГРУППЫ, потом ПЕРМИШЕНЫ
check-priority: permission-first


# =============================================
# ЛИМИТЫ ПО ПЕРМИШЕНАМ
# =============================================
permission-limits:

  # ----- ЛИМИТЫ РАЗМЕРА -----
  - permission: "regionmc.limit.10000"
    limit: 10000
  - permission: "regionmc.limit.20000"
    limit: 20000
  - permission: "regionmc.limit.30000"
    limit: 30000
  - permission: "regionmc.limit.40000"
    limit: 40000
  - permission: "regionmc.limit.50000"
    limit: 50000
  - permission: "regionmc.limit.100000"
    limit: 100000
  - permission: "regionmc.limit.unlimited"
    limit: -1

  # ----- ЛИМИТЫ КОЛИЧЕСТВА (читаются методом getMaxRegionsFromPermissions) -----
  - permission: "regionmc.maxregions.1"
    max-regions: 1
  - permission: "regionmc.maxregions.2"
    max-regions: 2
  - permission: "regionmc.maxregions.3"
    max-regions: 3
  - permission: "regionmc.maxregions.5"
    max-regions: 5
  - permission: "regionmc.maxregions.10"
    max-regions: 10
  - permission: "regionmc.maxregions.15"
    max-regions: 15
  - permission: "regionmc.maxregions.20"
    max-regions: 20
  - permission: "regionmc.maxregions.25"
    max-regions: 25
  - permission: "regionmc.maxregions.50"
    max-regions: 50
  - permission: "regionmc.maxregions.100"
    max-regions: 100
  - permission: "regionmc.maxregions.unlimited"
    max-regions: -1


# =============================================
# ЛИМИТЫ ПО ГРУППАМ (читаются методом getMaxRegionsFromGroups)
# =============================================
group-limits:
  default:
    size: 26000
    max-regions: 5
  vip:
    size: 32000
    max-regions: 10
  prem:
    size: 36000
    max-regions: 15
  premium:
    size: 40000
    max-regions: 20
  elite:
    size: 50000
    max-regions: 30
  creat:
    size: 42000
    max-regions: -1
  admin:
    size: -1
    max-regions: -1


# =============================================
# ЛИМИТ РАЗМЕРА ПО УМОЛЧАНИЮ
# =============================================
# Используется если не сработали другие проверки
default-limit: 100000


# =============================================
# СПЕЦИАЛЬНЫЕ ЗНАЧЕНИЯ
# =============================================
# limit: -1          → Безлимитно (нет ограничений)
# limit: 0           → Безлимитно (эквивалентно -1)
# limit: число > 0   → Конкретное ограничение
#
# max-height: -1     → Безлимитная высота
# max-height: 0      → Безлимитная высота
# max-height: 256    → Ограничение высоты 256 блоками
#
# min-size: -1       → Безлимитный минимум (0 блоков)
# min-size: 0        → Безлимитный минимум (0 блоков)
# min-size: > 0      → Минимальный размер в блоках
# =============================================


# =============================================
# ПРИМЕРЫ ИСПОЛЬЗОВАНИЯ
# =============================================
# 1. Обычный игрок:
#    - Размер: до 100 000 блоков
#    - Количество: до 5 регионов
#    - Высота: до 256 блоков
#
# 2. VIP игрок (права regionmc.maxregions.10 и regionmc.limit.50000):
#    - Размер: до 50 000 блоков
#    - Количество: до 10 регионов
#    - Высота: до 256 блоков
#
# 3. Безлимитная высота:
#    max-height: -1
#
# 4. Безлимитный размер:
#    max-size: -1
#
# 5. Безлимитное количество:
#    default-max-regions: -1
# =============================================