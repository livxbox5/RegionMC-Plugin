# ========== ????????? GRADLE ==========

org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configureondemand=true
org.gradle.daemon=true

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Путь к JDK 21 (проверьте, что папка существует)
org.gradle.java.home=C:/Program Files/Java/jdk-21

org.gradle.incremental=false

# ========== ????????? ???? ? ???????????? ==========

systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.retryCount=3

systemProp.gradle.cache.remote.timeout=120000
systemProp.gradle.cache.remote.retry=3

systemProp.gradle.warning.mode=summary
systemProp.org.gradle.internal.repository.retry.max.attempts=5

# ========== ????????? WINDOWS ==========

systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

# ========== ????????? ??? JAVA 21 ==========

systemProp.java.version=21

systemProp.org.gradle.internal.io.buffer.size=65536
systemProp.org.gradle.internal.publish.checksums.insecure=true

systemProp.gradle.signing.required=false

# ========== ????????? ??? INTELIJ IDEA ==========

idea.active=true
idea.extendedProcessing=true
idea.managed.dependency.repositories=enabled