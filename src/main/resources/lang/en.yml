# RegionMC English Language File
# Complete and organized version

prefix: "&6[RegionMC]&r "
no-prefix: "&6[RegionMC]&r "

# Basic commands
player-only: "&cThis command can only be used by players!"
unknown-command: "&cUnknown command!"
no-permission: "&cYou don't have permission to use this command!"
invalid-number: "&cInvalid number: {input}"

# Command usage
commands:
  no-permission: "&cYou don't have permission to use this command!"
  usage: "&eUsage: &7{usage}"
  claim: "&eUsage: &7/region claim <name>"
  delete: "&eUsage: &7/region delete <name>"
  info: "&eUsage: &7/region info <name>"
  list: "&eUsage: &7/region list [page]"
  flag: "&eUsage: &7/region flag <region> <flag> <value>"
  addmember: "&eUsage: &7/region addmember <region> <player>"
  addowner: "&eUsage: &7/region addowner <region> <player>"
  removemember: "&eUsage: &7/region removemember <region> <player>"
  removeowner: "&eUsage: &7/region removeowner <region> <player>"
  priority: "&eUsage: &7/region priority <region> <number>"
  expand: "&eUsage: &7/region expand <blocks> [up|down|north|south|east|west]"
  wand: "&eUsage: &7/region wand"
  bypass: "&eUsage: &7/region bypass"
  reload:
    use: "&eUsage: &7/region reload"
    start: "&aReloading RegionMC..."
    success: "&aPlugin reloaded successfully!"
    error: "&cFailed to reload RegionMC!"

# Region creation & management
region:
  not-found: "&cRegion '&e{name}&c' not found!"
  exists: "&cRegion '&e{name}&c' already exists!"
  created: "&aRegion '&e{name}&a' created successfully!"
  deleted: "&aRegion '&e{name}&a' deleted successfully!"
  renamed: "&aRegion renamed to '&e{name}&a'!"
  no-regions: "&cYou don't have any regions!"
  enter: "&aYou entered region &e{name}"
  exit: "&cYou left region &e{name}"
  enter-owner: "&aYou entered your region &e{name}"
  exit-owner: "&cYou left your region &e{name}"
  enter-member: "&aYou entered region &e{name} (member)"
  exit-member: "&cYou left region &e{name} (member)"

  create:
    invalid-name: "&cInvalid region name! Use letters, numbers, underscores (3-16 chars)"

  member:
    add:
      success: "&aPlayer '&e{0}&a' added as member to region '&e{1}&a'"
      failed: "&cFailed to add player '&e{0}&c' to region '&e{1}&c'"
    remove:
      success: "&aPlayer '&e{0}&a' removed from region '&e{1}&a'"
      failed: "&cFailed to remove player '&e{0}&c' from region '&e{1}&c'"

  owner:
    add:
      success: "&aPlayer '&e{0}&a' added as owner to region '&e{1}&a'"
      failed: "&cFailed to add player '&e{0}&c' as owner of region '&e{1}&c'"
    remove:
      success: "&aPlayer '&e{0}&a' removed as owner from region '&e{1}&a'"
      failed: "&cFailed to remove player '&e{0}&c' as owner of region '&e{1}&c'"

  priority-set: "&aPriority of region '&e{0}&a' set to &e{1}"
  priority-error: "&cFailed to set region priority!"
  different-worlds: "&cPositions are in different worlds!"

  # Selection
  pos1-set: "&aPosition 1 set at &e{x}&a, &e{y}&a, &e{z}&a"
  pos2-set: "&aPosition 2 set at &e{x}&a, &e{y}&a, &e{z}&a"
  selection-cleared: "&aSelection cleared!"
  no-selection: "&cNo positions selected! Use &e/region pos1 &cand &e/region pos2"

  # Members (old format)
  member-added: "&aPlayer '&e{player}&a' added as member to '&e{region}&a'"
  member-removed: "&aPlayer '&e{player}&a' removed from '&e{region}&a'"
  owner-added: "&aPlayer '&e{player}&a' added as owner to '&e{region}&a'"
  owner-removed: "&aPlayer '&e{player}&a' removed as owner from '&e{region}&a'"

  # Flags
  flag-set: "&aFlag '&e{flag}&a' set to '&e{value}&a' for '&e{region}&a'"
  flag-removed: "&aFlag '&e{flag}&a' removed from '&e{region}&a'"

  # Expansion system
  expand:
    success: "&aRegion expanded by &e{0}&a blocks in direction: &e{1}"
    auto-direction: "&6Automatically determined direction: &e{0}"
    failed: "&cFailed to expand region"
    no-selection: "&cNo region selected! Use &e/region pos1 &cand &e/region pos2 &cto select positions"
    direction-up: "up"
    direction-down: "down"
    direction-north: "north"
    direction-south: "south"
    direction-east: "east"
    direction-west: "west"
  notify:
    enter: "&ePlayer &6{1} &eentered your region &6{0}"
    exit: "&ePlayer &6{1} &eleaved your region &6{0}"

