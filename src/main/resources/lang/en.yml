  use-items: "Allow or deny using items"
  time-lock: "Time lock (day/night/deny)"
  autosave: "Region autosave"
  greeting: "Greeting message"
  farewell: "Farewell message"
  damage-animals: "Allow or deny damaging friendly animals"
  ride: "Allow or deny riding vehicles or animals"
  respawn-anchors: "Allow or deny using respawn anchors"
  tnt: "Allow or deny TNT detonation and block damage"
  mob-damage: "Allow or deny damage from mobs"
