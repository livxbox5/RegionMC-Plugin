# RegionMC Russian Language File
# Полная и организованная версия

prefix: "&6[RegionMC]&r "
no-prefix: "&6[RegionMC]&r "

# Основные команды
player-only: "&cЭта команда только для игроков!"
unknown-command: "&cНеизвестная команда!"
no-permission: "&cУ вас нет прав для этой команды!"
invalid-number: "&cНеверное число: {input}"

# Использование команд
commands:
  no-permission: "&cУ вас нет прав для этой команды!"
  usage: "&eИспользование: &7{usage}"
  claim: "&eИспользование: &7/region claim <название>"
  delete: "&eИспользование: &7/region delete <название>"
  info: "&eИспользование: &7/region info <название>"
  list: "&eИспользование: &7/region list [страница]"
  flag: "&eИспользование: &7/region flag <регион> <флаг> <значение>"
  addmember: "&eИспользование: &7/region addmember <регион> <игрок>"
  addowner: "&eИспользование: &7/region addowner <регион> <игрок>"
  removemember: "&eИспользование: &7/region removemember <регион> <игрок>"
  removeowner: "&eИспользование: &7/region removeowner <регион> <игрок>"
  priority: "&eИспользование: &7/region priority <регион> <число>"
  expand: "&eИспользование: &7/region expand <блоки> [up|down|north|south|east|west]"
  wand: "&eИспользование: &7/region wand"
  bypass: "&eИспользование: &7/region bypass"
  reload:
    use: "&eИспользование: &7/region reload"
    start: "&aПерезагружаю RegionMC..."
    success: "&aПлагин перезагружен успешно!"
    error: "&cНе удалось перезагрузить RegionMC!"

# Создание и управление регионами
region:
  not-found: "&cРегион '&e{name}&c' не найден!"
  exists: "&cРегион '&e{name}&c' уже существует!"
  created: "&aРегион '&e{name}&a' успешно создан!"
  deleted: "&aРегион '&e{name}&a' успешно удален!"
  renamed: "&aРегион переименован в '&e{name}&a'!"
  no-regions: "&cУ вас нет регионов!"
  enter: "&aВы вошли в регион &e{name}"
  exit: "&cВы вышли из региона &e{name}"
  enter-owner: "&aВы вошли в свой регион &e{name}"
  exit-owner: "&cВы вышли из своего региона &e{name}"
  enter-member: "&aВы вошли в регион &e{name} (участник)"
  exit-member: "&cВы вышли из региона &e{name} (участник)"

  create:
    invalid-name: "&cНеверное имя региона! Используйте буквы, цифры, подчеркивания (3-16 символов)"

  member:
    add:
      success: "&aИгрок '&e{0}&a' добавлен как участник в регион '&e{1}&a'"
      failed: "&cНе удалось добавить игрока '&e{0}&c' в регион '&e{1}&c'"
    remove:
      success: "&aИгрок '&e{0}&a' удален из участников региона '&e{1}&a'"
      failed: "&cНе удалось удалить игрока '&e{0}&c' из региона '&e{1}&c'"

  owner:
    add:
      success: "&aИгрок '&e{0}&a' добавлен как владелец в регион '&e{1}&a'"
      failed: "&cНе удалось добавить игрока '&e{0}&c' как владельца региона '&e{1}&c'"
    remove:
      success: "&aИгрок '&e{0}&a' удален из владельцев региона '&e{1}&a'"
      failed: "&cНе удалось удалить игрока '&e{0}&c' из владельцев региона '&e{1}&c'"

  priority-set: "&aПриоритет региона '&e{0}&a' установлен на &e{1}"
  priority-error: "&cНе удалось установить приоритет региона!"
  different-worlds: "&cПозиции должны быть в одном мире!"

  # Выделение
  pos1-set: "&aПозиция 1 установлена в &e{x}&a, &e{y}&a, &e{z}&a"
  pos2-set: "&aПозиция 2 установлена в &e{x}&a, &e{y}&a, &e{z}&a"
  selection-cleared: "&aВыделение очищено!"
  no-selection: "&cПозиции не установлены! Используйте &e/region pos1 &cи &e/region pos2"

  # Участники (старый формат)
  member-added: "&aИгрок '&e{player}&a' добавлен в регион '&e{region}&a'"
  member-removed: "&aИгрок '&e{player}&a' удален из региона '&e{region}&a'"
  owner-added: "&aИгрок '&e{player}&a' добавлен как владелец в '&e{region}&a'"
  owner-removed: "&aИгрок '&e{player}&a' удален как владелец из '&e{region}&a'"

  # Флаги
  flag-set: "&aФлаг '&e{flag}&a' установлен в '&e{value}&a' для '&e{region}&a'"
  flag-removed: "&aФлаг '&e{flag}&a' удален из '&e{region}&a'"

  # Система расширения
  expand:
    success: "&aРегион расширен на &e{0}&a блоков в направлении: &e{1}"
    auto-direction: "&6Автоматически определено направление: &e{0}"
    failed: "&cНе удалось расширить регион"
    no-selection: "&cРегион не выбран! Используйте &e/region pos1 &cи &e/region pos2 &cдля выбора позиций"
    direction-up: "верх"
    direction-down: "низ"
    direction-north: "север"
    direction-south: "юг"
    direction-east: "восток"
    direction-west: "запад"
  notify:
    enter: "&eИгрок &6{1} &eзашёл в ваш регион &6{0}"
    exit: "&eИгрок &6{1} &eвышел из вашего региона &6{0}"

