name: RegionMC
version: ${version}
main: org.KillerYT.regionMC.RegionMC
api-version: '1.21'
description: Advanced Dynamic Region Protection
author: KillerYT
website: https://github.com/KillerYT
load: POSTWORLD

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    KillerCoreAPI:
      load: BEFORE
      required: true
      join-classpath: true

commands:
  regionmc:
    description: Main region management command
    usage: /<command> <subcommand>
    aliases: [region, rg]
    permission: regionmc.command.region
    permission-message: "§cУ вас нет прав на использование этой команды!"

permissions:

  # ================================================
  # КОРНЕВОЕ ПРАВО — ВСЁ ВКЛЮЧЕНО
  # ================================================
  regionmc.*:
    description: Полный доступ к плагину
    default: false
    children:
      regionmc.admin: true
      regionmc.command.*: true
      regionmc.flags.*: true
      regionmc.bypass.*: true
      regionmc.limit.unlimited: true
      regionmc.maxregions.unlimited: true
      regionmc.region.create: true
      regionmc.region.delete: true

  # ================================================
  # АДМИНИСТРАТОР
  # ================================================
  regionmc.admin:
    description: Администратор плагина
    default: op
    children:
      regionmc.command.*: true
      regionmc.flags.*: true
      regionmc.limit.unlimited: true
      regionmc.maxregions.unlimited: true
      regionmc.region.create: true
      regionmc.region.delete: true

  # ================================================
  # РОДИТЕЛЬСКОЕ ПРАВО НА ВСЕ КОМАНДЫ
  # ================================================
  regionmc.command.*:
    description: Доступ ко всем командам
    default: false
    children:
      regionmc.command.region: true
      regionmc.command.help: true
      regionmc.command.example: true
      regionmc.command.claim: true
      regionmc.command.pos: true
      regionmc.command.info: true
      regionmc.command.list: true
      regionmc.command.flag: true
      regionmc.command.addmember: true
      regionmc.command.addowner: true
      regionmc.command.removemember: true
      regionmc.command.removeowner: true
      regionmc.command.priority: true
      regionmc.command.delete: true
      regionmc.command.wand: true
      regionmc.command.expand: true
      regionmc.command.show: true
      regionmc.command.reload: true
      regionmc.command.testplaceholders: true
      regionmc.command.limit: true
      regionmc.command.rent: true

  # ================================================
  # КОМАНДЫ
  # ================================================
  regionmc.command.region:
    description: Основная команда плагина
    default: false

  regionmc.command.help:
    description: Справка
    default: false

  regionmc.command.example:
    description: Примеры команд
    default: false

  regionmc.command.claim:
    description: Создание региона
    default: false

  regionmc.command.pos:
    description: Установка позиций
    default: false

  regionmc.command.info:
    description: Информация о регионе
    default: false

  regionmc.command.list:
    description: Список регионов
    default: false

  regionmc.command.flag:
    description: Управление флагами
    default: false

  regionmc.command.addmember:
    description: Добавить участника
    default: false

  regionmc.command.addowner:
    description: Добавить владельца
    default: false

  regionmc.command.removemember:
    description: Удалить участника
    default: false

  regionmc.command.removeowner:
    description: Удалить владельца
    default: false

  regionmc.command.priority:
    description: Приоритет региона
    default: false

  regionmc.command.delete:
    description: Удаление региона
    default: false

  regionmc.command.wand:
    description: Палочка выделения
    default: false

  regionmc.command.expand:
    description: Расширение региона
    default: false

  regionmc.command.show:
    description: Показ/скрытие границ
    default: false

  regionmc.command.reload:
    description: Перезагрузка плагина
    default: false

  regionmc.command.testplaceholders:
    description: Тест плейсхолдеров
    default: false

  regionmc.command.limit:
    description: Информация о лимитах
    default: false

  # ================================================
  # ПРАВА НА ДЕЙСТВИЯ С РЕГИОНАМИ
  # ================================================
  regionmc.region.create:
    description: Создание регионов
    default: false
    children:
      regionmc.command.claim: true

  regionmc.region.delete:
    description: Удаление регионов
    default: false
    children:
      regionmc.command.delete: true

  # ================================================
  # РОДИТЕЛЬСКОЕ ПРАВО НА ВСЕ ФЛАГИ
  # ================================================
  regionmc.flags.*:
    description: Доступ ко всем флагам
    default: false
    children:
      regionmc.command.flag: true
      regionmc.flags.build: true
      regionmc.flags.break: true
      regionmc.flags.place: true
      regionmc.flags.interact: true
      regionmc.flags.use: true
      regionmc.flags.use-items: true
      regionmc.flags.pvp: true
      regionmc.flags.mob-damage: true
      regionmc.flags.fall-damage: true
      regionmc.flags.ender-dragon-damage: true
      regionmc.flags.entry: true
      regionmc.flags.exit: true
      regionmc.flags.chest-access: true
      regionmc.flags.enderchest: true
      regionmc.flags.item-pickup: true
      regionmc.flags.item-drop: true
      regionmc.flags.exp-drops: true
      regionmc.flags.fire-spread: true
      regionmc.flags.explosions: true
      regionmc.flags.creeper-explosion: true
      regionmc.flags.pistons: true
      regionmc.flags.grass-growth: true
      regionmc.flags.leaf-decay: true
      regionmc.flags.enderman-grief: true
      regionmc.flags.time-lock: true
      regionmc.flags.mob-spawning: true
      regionmc.flags.block-chat: true
      regionmc.flags.blockcmd: true
      regionmc.flags.sleep: true

  # ================================================
  # ФЛАГИ СТРОИТЕЛЬСТВА И ВЗАИМОДЕЙСТВИЯ
  # ================================================
  regionmc.flags.build:
    description: Флаг build
    default: false

  regionmc.flags.break:
    description: Флаг break
    default: false

  regionmc.flags.place:
    description: Флаг place
    default: false

  regionmc.flags.interact:
    description: Флаг interact
    default: false

  regionmc.flags.use:
    description: Флаг use
    default: false

  regionmc.flags.use-items:
    description: Флаг use-items
    default: false

  # ================================================
  # ФЛАГИ PVP И УРОНА
  # ================================================
  regionmc.flags.pvp:
    description: Флаг pvp
    default: false

  regionmc.flags.mob-damage:
    description: Флаг mob-damage
    default: false

  regionmc.flags.fall-damage:
    description: Флаг fall-damage
    default: false

  regionmc.flags.ender-dragon-damage:
    description: Флаг ender-dragon-damage
    default: false

  # ================================================
  # ФЛАГИ ДОСТУПА И ПЕРЕМЕЩЕНИЯ
  # ================================================
  regionmc.flags.entry:
    description: Флаг entry
    default: false

  regionmc.flags.exit:
    description: Флаг exit
    default: false

  regionmc.flags.chest-access:
    description: Флаг chest-access
    default: false

  regionmc.flags.enderchest:
    description: Флаг enderchest
    default: false

  # ================================================
  # ФЛАГИ ПРЕДМЕТОВ
  # ================================================
  regionmc.flags.item-pickup:
    description: Флаг item-pickup
    default: false

  regionmc.flags.item-drop:
    description: Флаг item-drop
    default: false

  regionmc.flags.exp-drops:
    description: Флаг exp-drops
    default: false

  # ================================================
  # ФЛАГИ ОКРУЖАЮЩЕЙ СРЕДЫ
  # ================================================
  regionmc.flags.fire-spread:
    description: Флаг fire-spread
    default: false

  regionmc.flags.explosions:
    description: Флаг explosions
    default: false

  regionmc.flags.creeper-explosion:
    description: Флаг creeper-explosion
    default: false

  regionmc.flags.pistons:
    description: Флаг pistons
    default: false

  regionmc.flags.grass-growth:
    description: Флаг grass-growth
    default: false

  regionmc.flags.leaf-decay:
    description: Флаг leaf-decay
    default: false

  regionmc.flags.enderman-grief:
    description: Флаг enderman-grief
    default: false

  regionmc.flags.time-lock:
    description: Флаг time-lock
    default: false

  # ================================================
  # ФЛАГИ МОБОВ
  # ================================================
  regionmc.flags.mob-spawning:
    description: Флаг mob-spawning
    default: false

  # ================================================
  # ФЛАГИ КОММУНИКАЦИЙ И КОМАНД
  # ================================================
  regionmc.flags.block-chat:
    description: Флаг block-chat
    default: false

  regionmc.flags.blockcmd:
    description: Флаг blockcmd
    default: false

  # ================================================
  # ПРОЧИЕ ФЛАГИ
  # ================================================
  regionmc.flags.sleep:
    description: Флаг sleep
    default: false

  # ================================================
  # ГРУППА: БАЗОВЫЕ ПРАВА ПОЛЬЗОВАТЕЛЯ
  # ================================================
  regionmc.command.user:
    description: Базовые права пользователя
    default: false
    children:
      regionmc.command.region: true
      regionmc.command.help: true
      regionmc.command.info: true
      regionmc.command.list: true
      regionmc.command.limit: true
      regionmc.command.pos: true
      regionmc.command.wand: true
      regionmc.command.show: true
      regionmc.region.create: true
      regionmc.region.delete: true
      regionmc.command.addmember: true
      regionmc.command.addowner: true
      regionmc.command.removemember: true
      regionmc.command.removeowner: true
      regionmc.command.priority: true
      regionmc.flags.build: true
      regionmc.flags.break: true
      regionmc.flags.place: true
      regionmc.flags.interact: true
      regionmc.flags.use: true
      regionmc.flags.use-items: true
      regionmc.flags.pvp: true
      regionmc.flags.mob-damage: true
      regionmc.flags.fall-damage: true
      regionmc.flags.ender-dragon-damage: true
      regionmc.flags.entry: true
      regionmc.flags.exit: true
      regionmc.flags.chest-access: true
      regionmc.flags.enderchest: true
      regionmc.flags.item-pickup: true
      regionmc.flags.item-drop: true
      regionmc.flags.exp-drops: true
      regionmc.flags.fire-spread: true
      regionmc.flags.explosions: true
      regionmc.flags.creeper-explosion: true
      regionmc.flags.pistons: true
      regionmc.flags.grass-growth: true
      regionmc.flags.leaf-decay: true
      regionmc.flags.enderman-grief: true
      regionmc.flags.time-lock: true
      regionmc.flags.mob-spawning: true
      regionmc.flags.block-chat: true
      regionmc.flags.blockcmd: true
      regionmc.flags.sleep: true

  # ================================================
  # ЛИМИТЫ РАЗМЕРА
  # ================================================
  regionmc.limit.unlimited:
    description: Безлимитный размер
    default: false

  regionmc.limit.10000:
