    default: false

  # ================================================
  # БАЙПАС
  # ================================================
  regionmc.bypass.*:
    description: Обход защиты всех регионов
    default: false
    children:
      regionmc.bypass.all: true
      regionmc.bypass.chat: true

  regionmc.bypass.all:
    description: Обход защиты всех регионов
    default: false

  regionmc.bypass.chat:
    description: Обход блокировки чата
    default: false

  # ================================================
  # АРЕНДА РЕГИОНОВ
  # ================================================
  regionmc.command.rent:
