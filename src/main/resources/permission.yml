  description: "Лимит для YouTube/Media"

regionmc.limit.admin:
  description: "Лимит для администраторов"

# ================================================
# 🛡️ БАЙПАС (ОБХОД ЗАЩИТЫ)
# ================================================

regionmc.bypass.*:
  description: "Обход защиты ВСЕХ регионов"

regionmc.bypass.(Название региона):
  description: "Обход защиты кокретного региона если вы используйте regionmc.bypass.* в luckperms то не забудте  важние регионы у казать false regionmc.bypass.spawn false и regionmc.bypass.pvp false  "

regionmc.bypass.all:
  description: "Обход защиты всех регионов (альтернатива)"

regionmc.bypass.chat:
  description: "Обход блокировки чата в регионе"

# ================================================
# 🏷️ АРЕНДА РЕГИОНОВ
# ================================================

regionmc.command.rent:
  description: "Доступ ко всем командам аренды"

regionmc.rent.use:
  description: "Право арендовать регион"

regionmc.rent.price:
  description: "Право устанавливать цену аренды (владелец региона)"

regionmc.rent.cancel:
  description: "Право отменять аренду (владелец или арендатор)"

regionmc.rent.extend:
  description: "Право продлевать аренду (только арендатор)"

regionmc.rent.info:
  description: "Право просматривать информацию об аренде"

# Байпас для конкретного региона
# regionmc.bypass.<название_региона>
# Пример: regionmc.bypass.spawn - обход защиты региона spawn

# ================================================
# ⭐ ГОТОВЫЕ НАБОРЫ ПРАВ (ДЛЯ ГРУПП)
#            Могут не работать
# ================================================

# Набор для обычного игрока
regionmc.group.player:
  description: "Базовые права игрока"
  children:
    - regionmc.command.region
    - regionmc.command.claim
    - regionmc.command.pos
    - regionmc.command.wand
    - regionmc.command.expand
    - regionmc.command.delete
    - regionmc.command.remove
    - regionmc.command.priority
    - regionmc.command.addmember
    - regionmc.command.removemember
    - regionmc.command.flag
    - regionmc.command.info
    - regionmc.command.list
    - regionmc.command.limit
    - regionmc.command.show
    - regionmc.command.help
    - regionmc.limit.default

# Набор для VIP
regionmc.group.vip:
  description: "Права VIP-игрока"
  children:
    - regionmc.group.player
    - regionmc.command.addowner
    - regionmc.command.removeowner
    - regionmc.limit.vip

# Набор для Premium
regionmc.group.premium:
  description: "Права Premium-игрока"
  children:
    - regionmc.group.vip
    - regionmc.limit.premium

# Набор для модератора
regionmc.group.moderator:
  description: "Права модератора"
  children:
    - regionmc.group.player
    - regionmc.bypass.chat
    - regionmc.command.testplaceholders

# Набор для администратора
regionmc.group.admin:
  description: "Права администратора"
  children:
    - regionmc.admin
    - regionmc.limit.unlimited

# ================================================
# 📝 ПРИМЕЧАНИЯ
# ================================================
#
# 1. Базовое право regionmc.command.region ОБЯЗАТЕЛЬНО для использования любых команд
# 2. Владельцы и участники региона автоматически имеют доступ к своему региону
# 3. Лимиты проверяются из файла limit.yml (секции permission-limits и group-limits)
# 4. Байпас защиты НЕ даёт автоматического доступа к командам
# 5. Для работы флагов нужны соответствующие обработчики в RegionProtection
#
# ================================================