# ================================================
# RegionMC - Permissions Configuration
# ================================================

# ================================================
# RegionMC - Все права
# ================================================
regionmc.command.*:
  description: "Доступ все комманды"
regionmc.flags.* (1):
  description: "Доступ все флагам"
regionmc.limit.:
  description: "Доступ к лимит после . группу из limit.yml"


# ================================================
# 🔑 АДМИНИСТРАТОРСКИЕ ПРАВА
# ================================================
regionmc.admin:
  description: "Полный доступ ко всем функциям плагина (всё включено)"

# ================================================
# 📋 БАЗОВЫЕ КОМАНДЫ (ОБЯЗАТЕЛЬНЫЕ)
# ================================================
regionmc.command.region:
  description: "Базовый доступ к командам плагина (/region, /rg, /regionmc)"

regionmc.command.claim:
  description: "Создание региона - /region claim <название>"

regionmc.command.pos:
  description: "Установка позиций - /region pos1, /region pos2"

regionmc.command.wand:
  description: "Получение палочки выделения - /region wand"

regionmc.command.expand:
  description: "Расширение региона - /region expand <блоки> <направление>"

regionmc.command.delete:
  description: "Удаление региона - /region delete <название>"

regionmc.command.remove:
  description: "Удаление региона - /region remove <название> (алиас)"

regionmc.command.priority:
  description: "Установка приоритета - /region priority <регион> <число>"

# ================================================
# 👥 УПРАВЛЕНИЕ УЧАСТНИКАМИ
# ================================================
regionmc.command.addmember:
  description: "Добавить участника - /region addmember <регион> <игрок>"

regionmc.command.removemember:
  description: "Удалить участника - /region removemember <регион> <игрок>"

regionmc.command.addowner:
  description: "Добавить владельца - /region addowner <регион> <игрок>"

regionmc.command.removeowner:
  description: "Удалить владельца - /region removeowner <регион> <игрок>"

# ================================================
# ℹ️ ИНФОРМАЦИОННЫЕ КОМАНДЫ
# ================================================
regionmc.command.info:
  description: "Информация о регионе - /region info [название]"

regionmc.command.list:
  description: "Список регионов - /region list"

regionmc.command.show:
  description: "Показ/скрытие границ - /region show/hide <регион>"

regionmc.command.limit:
  description: "Информация о лимитах - /region limit"

regionmc.command.help:
  description: "Справка и примеры - /region help, /region example"

# ================================================
# 🔧 АДМИНИСТРАТИВНЫЕ КОМАНДЫ
# ================================================
regionmc.command.reload:
  description: "Перезагрузка плагина - /region reload"

regionmc.command.testplaceholders:
  description: "Тест плейсхолдеров - /region testplaceholders"

