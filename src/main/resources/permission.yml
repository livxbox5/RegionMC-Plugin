  description: "Безлимитное создание регионов (нет ограничений по размеру)"

# Конкретные лимиты (в блоках)
regionmc.limit.10000:
  description: "Лимит размера региона: 10 000 блоков"

regionmc.limit.20000:
  description: "Лимит размера региона: 20 000 блоков"

